<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Productos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="app-header">
        
        <div class="header-left">
            <div class="logo"><i class="fas fa-shopping-basket"></i> Portal</div>
            <ul class="nav-links">
                <li><a href="/" id="products-link">Productos</a></li>
                <li><a href="/chat.html" id="chat-link" style="display:none;">Chat</a></li>
            </ul>
        </div>
        
        <div class="header-right">
            <div id="guest-nav">
                <button id="show-login-btn" class="btn btn-outline">Iniciar Sesión</button>
                <button id="show-register-btn" class="btn btn-primary">Registrarse</button>
            </div>
            <div id="user-nav" style="display:none;">
                <span id="welcome-msg"></span>
                <button id="logout-btn" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </header>

    <main class="container">

        <section id="auth-page" style="display:none;">
            <div id="login-view" class="card auth-card">
                <h2 class="auth-title">Iniciar Sesión</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" class="form-control" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" class="form-control" placeholder="Contraseña" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
                    <p id="login-error" class="feedback-message error" style="display:none;"></p>
                </form>
                <p class="auth-switch">¿No tienes cuenta? <a href="#" id="auth-switch-to-register">Regístrate</a></p>
            </div>

            <div id="register-view" class="card auth-card" style="display:none;">
                <h2 class="auth-title">Crear Cuenta</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" class="form-control" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Contraseña</label>
                        <input type="password" id="register-password" class="form-control" placeholder="Mínimo 6 caracteres" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;">Registrar</button>
                    <p id="register-error" class="feedback-message error" style="display:none;"></p>
                    <p id="register-success" class="feedback-message success" style="display:none;"></p>
                </form>
                <p class="auth-switch">¿Ya tienes cuenta? <a href="#" id="auth-switch-to-login">Inicia Sesión</a></p>
            </div>
        </section>

        <section id="products-page" style="display:none;">
            
            <div id="admin-panel" class="card" style="display:none;">
                <button id="admin-toggle-btn" class="btn btn-primary collapsed" style="width:100%;">
                    <i class="fas fa-plus-circle"></i>
                    Añadir Nuevo Producto
                    <i class="fas fa-chevron-down toggle-icon" style="margin-left:auto;"></i>
                </button>

                <div id="admin-form-container" style="display:none;">
                    <h3 id="form-title" style="margin-bottom: 1.5rem; text-align:center;"></h3>
                    <form id="product-form">
                        <input type="hidden" id="product-id">
                        <div class="form-group">
                            <label for="product-name">Nombre</label>
                            <input type="text" id="product-name" class="form-control" placeholder="Nombre del producto" required>
                        </div>
                        <div class="form-group">
                            <label for="product-desc">Descripción</label>
                            <textarea id="product-desc" class="form-control" placeholder="Descripción detallada" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="product-price">Precio</label>
                            <input type="number" id="product-price" class="form-control" placeholder="Ej: 19.99" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="product-stock">Stock</label>
                            <input type="number" id="product-stock" class="form-control" placeholder="Ej: 50" required>
                        </div>
                        <div class="form-group">
                            <label for="product-image">Imagen del Producto</label>
                            <input type="file" id="product-image" class="form-control" accept="image/*">
                        </div>
                        <div id="image-preview-container" style="display:none;">
                            <img id="image-preview" src="#" alt="Previsualización de Imagen" />
                            <button type="button" id="clear-image-btn" class="btn btn-secondary">Quitar Imagen</button>
                        </div>
                        <p id="product-form-error" class="feedback-message error" style="display:none;"></p>
                        <p id="product-form-success" class="feedback-message success" style="display:none;"></p>

                        <button type="submit" id="submit-product-btn" class="btn btn-primary"></button>
                        <button type="button" id="cancel-edit-btn" class="btn btn-outline" style="display:none; margin-left: 10px;">Cancelar Edición</button>
                    </form>
                </div>
            </div>
            
            <h2 class="page-title">Nuestros Productos</h2>
            <ul id="product-list">
                </ul>
        </section>

    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
